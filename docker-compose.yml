services:
  db:
    image: postgres:16
    container_name: chaos_twin_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chaostwin
    ports:
      - "5432:5432"
    volumes:
      - chaos_twin_pgdata:/var/lib/postgresql/data

volumes:
  chaos_twin_pgdata: